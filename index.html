<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="NAVI AI Chat"/>
<meta name="theme-color" content="#1a1a2e"/>
<link rel="manifest" href="./manifest.json"/>
<link rel="icon" href="./icon.svg" type="image/svg+xml"/>
<title>NAVI AI Chat</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f1a;color:#e8e8f0;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;position:relative;background:#0f0f1a}
  #header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#1a1a2e;border-bottom:1px solid #2a2a4a;gap:8px;min-height:58px}
  #menu-btn{background:none;border:none;color:#a0a0c0;font-size:22px;cursor:pointer;padding:4px 8px;border-radius:8px}
  #header-title{font-size:16px;font-weight:700;flex:1;text-align:center;white-space:nowrap}
  #ai-switcher{display:flex;gap:6px}
  .ai-btn{padding:6px 10px;border-radius:20px;border:1.5px solid transparent;font-size:12px;font-weight:700;cursor:pointer;background:transparent}
  .ai-btn.chatgpt{border-color:#2ea86a;color:#2ea86a}.ai-btn.chatgpt.active{background:#2ea86a;color:white}
  .ai-btn.gemini{border-color:#4285f4;color:#4285f4}.ai-btn.gemini.active{background:#4285f4;color:white}
  .ai-btn.unavailable{opacity:.45}
  #sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100}
  #sidebar-overlay.open{display:block}
  #sidebar{position:fixed;top:0;left:-290px;width:275px;height:100%;background:#12122a;border-right:1px solid #2a2a4a;z-index:101;transition:left .25s ease;display:flex;flex-direction:column;padding:20px 16px;gap:12px}
  #sidebar.open{left:0}
  #sidebar h2{font-size:18px;color:#c0c0e0;margin-bottom:6px}
  .section-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#6060a0;margin-top:6px}
  .status-card{border:1px solid #2a2a4a;background:#0f0f1a;border-radius:12px;padding:11px 12px;font-size:13px;line-height:1.55}
  .status-row{display:flex;justify-content:space-between;gap:10px}.ok{color:#2ea86a}.warn{color:#fbbf24}.bad{color:#ff6680}
  .field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:#9090b0}.field input{padding:9px 10px;border-radius:8px;border:1px solid #2a2a4a;background:#0f0f1a;color:#e8e8f0;outline:none}
  .hint{font-size:11px;color:#686890;line-height:1.5}
  .side-btn{padding:10px;border-radius:10px;border:1px solid #3a3a5a;background:#17172e;color:#d8d8e8;font-weight:600;cursor:pointer}
  #clear-btn{margin-top:auto;border-color:#ff4466;color:#ff6680;background:transparent}
  #chat-area{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
  #empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;color:#7070a8;text-align:center;padding:24px}
  #empty-state .icon{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#2563eb);color:white;font-weight:800;font-size:28px}
  #empty-state p{font-size:14px;line-height:1.7}
  .msg{display:flex;flex-direction:column;max-width:86%;animation:fadeIn .18s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .msg.user{align-self:flex-end;align-items:flex-end}.msg.ai{align-self:flex-start;align-items:flex-start}
  .msg-bubble{padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.55;word-break:break-word;white-space:pre-wrap}
  .msg.user .msg-bubble{background:#4285f4;color:white;border-bottom-right-radius:4px}
  .msg.ai .msg-bubble{background:#1e1e38;color:#e8e8f0;border-bottom-left-radius:4px}
  .msg-meta{font-size:11px;color:#6060a0;margin-top:3px;padding:0 4px}.badge-chatgpt{color:#2ea86a}.badge-gemini{color:#4285f4}
  .typing-bubble{display:flex;gap:5px;align-items:center;padding:12px 16px}.typing-bubble span{width:8px;height:8px;border-radius:50%;background:#6060a0;animation:bounce 1.2s infinite}.typing-bubble span:nth-child(2){animation-delay:.2s}.typing-bubble span:nth-child(3){animation-delay:.4s}@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
  #input-area{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:#1a1a2e;border-top:1px solid #2a2a4a}
  #user-input{flex:1;padding:10px 14px;border-radius:22px;border:1.5px solid #2a2a4a;background:#0f0f1a;color:#e8e8f0;font-size:15px;resize:none;outline:none;max-height:120px;min-height:42px;line-height:1.4;font-family:inherit}
  #user-input:focus{border-color:#4285f4}
  #send-btn{width:42px;height:42px;border-radius:50%;border:none;background:#4285f4;color:white;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  #send-btn:disabled{background:#2a2a4a;cursor:not-allowed}
  #toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(18px);background:#2a2a4a;color:#e8e8f0;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:200;max-width:90%;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>
  <div id="sidebar">
    <h2>⚙️ 設定</h2>

    <div class="section-title">接続状態</div>
    <div class="status-card">
      <div class="status-row"><span>Gateway</span><strong id="gateway-status" class="warn">確認中</strong></div>
      <div class="status-row"><span>ChatGPT</span><strong id="openai-status">確認中</strong></div>
      <div class="status-row"><span>Gemini</span><strong id="gemini-status">確認中</strong></div>
    </div>

    <div class="section-title">Gateway Access Key</div>
    <div class="field">
      <label for="gateway-key">接続キー</label>
      <input id="gateway-key" type="password" placeholder="Gateway key"/>
      <div class="hint">OpenAI / Gemini のAPIキーはここには入れません。APIキーはRailway側だけで管理します。この接続キーもリポジトリには保存されません。</div>
    </div>
    <button class="side-btn" onclick="saveGatewayKey()">このセッションで使用</button>

    <div class="section-title">外部自由領域</div>
    <div class="status-card">
      <div id="region-status">サーバー側で参照します。保護されたメタルール本文はブラウザへ返しません。</div>
    </div>

    <button id="clear-btn" class="side-btn" onclick="clearChat()">🗑 チャット履歴を削除</button>
  </div>

  <div id="header">
    <button id="menu-btn" onclick="toggleSidebar()">☰</button>
    <div id="header-title">💬 ChatGPT</div>
    <div id="ai-switcher">
      <button class="ai-btn chatgpt active" id="sw-chatgpt" onclick="switchAI('chatgpt')">ChatGPT</button>
      <button class="ai-btn gemini" id="sw-gemini" onclick="switchAI('gemini')">Gemini</button>
    </div>
  </div>

  <div id="chat-area">
    <div id="empty-state">
      <div class="icon">N</div>
      <p>ChatGPT または Gemini を選んで<br/>会話を始めましょう。<br/><br/>AIの秘密鍵はこのページには保存しません。</p>
    </div>
  </div>

  <div id="input-area">
    <textarea id="user-input" oninput="autoResize(this)" onkeydown="handleKey(event)" placeholder="メッセージを入力..." rows="1"></textarea>
    <button id="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>
<div id="toast"></div>

<script>
const GATEWAY_BASE = 'https://navi-api-production-42c9.up.railway.app';
const CHAT_KEY_SESSION = 'navi_gateway_chat_key_v1';
const CHAT_STORAGE = 'navi_chat_messages_v2';
const AI_STORAGE = 'navi_current_ai_v2';

let currentAI = localStorage.getItem(AI_STORAGE) || 'chatgpt';
let messages = JSON.parse(localStorage.getItem(CHAT_STORAGE) || '[]');
let isLoading = false;
let providerStatus = {openai:false, gemini:false};

window.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('gateway-key').value = sessionStorage.getItem(CHAT_KEY_SESSION) || '';
  updateAIUI();
  renderMessages();
  await checkGateway();
});

function saveMessages(){
  localStorage.setItem(CHAT_STORAGE, JSON.stringify(messages.slice(-100)));
}
function saveGatewayKey(){
  const key=document.getElementById('gateway-key').value.trim();
  if(key) sessionStorage.setItem(CHAT_KEY_SESSION,key);
  else sessionStorage.removeItem(CHAT_KEY_SESSION);
  showToast(key ? '接続キーをこのセッションに設定しました' : '接続キーを解除しました');
}

function switchAI(ai){
  currentAI=ai;
  localStorage.setItem(AI_STORAGE,ai);
  updateAIUI();
  const provider=ai==='chatgpt'?'openai':'gemini';
  if(!providerStatus[provider]) showToast((ai==='chatgpt'?'ChatGPT':'Gemini')+' はサーバー側APIキーが未設定です');
}

function updateAIUI(){
  document.getElementById('sw-chatgpt').classList.toggle('active',currentAI==='chatgpt');
  document.getElementById('sw-gemini').classList.toggle('active',currentAI==='gemini');
  document.getElementById('header-title').textContent=currentAI==='chatgpt'?'💬 ChatGPT':'✨ Gemini';
}

async function checkGateway(){
  try{
    const health=await fetch(GATEWAY_BASE+'/health',{cache:'no-store'});
    if(!health.ok) throw new Error('health');
    document.getElementById('gateway-status').textContent='接続';
    document.getElementById('gateway-status').className='ok';

    const statusRes=await fetch(GATEWAY_BASE+'/api/status',{cache:'no-store'});
    if(statusRes.ok){
      const data=await statusRes.json();
      providerStatus=data.providers||providerStatus;
      setProviderState('openai',providerStatus.openai);
      setProviderState('gemini',providerStatus.gemini);
      document.getElementById('region-status').textContent=
        '外部自由領域: '+(data.meta_rules_status||'unknown')+' / project: '+(data.project_id||'未設定')+
        '。メタルール本文は非公開です。';
    }
  }catch(e){
    document.getElementById('gateway-status').textContent='未接続';
    document.getElementById('gateway-status').className='bad';
    setProviderState('openai',false);
    setProviderState('gemini',false);
  }
}

function setProviderState(provider,ok){
  const id=provider==='openai'?'openai-status':'gemini-status';
  const el=document.getElementById(id);
  el.textContent=ok?'利用可':'未設定';
  el.className=ok?'ok':'warn';
  const btn=document.getElementById(provider==='openai'?'sw-chatgpt':'sw-gemini');
  btn.classList.toggle('unavailable',!ok);
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

async function sendMessage(){
  const input=document.getElementById('user-input');
  const text=input.value.trim();
  if(!text||isLoading) return;

  const provider=currentAI==='chatgpt'?'openai':'gemini';
  if(!providerStatus[provider]){
    showToast((currentAI==='chatgpt'?'ChatGPT':'Gemini')+' のAPIキーがRailway側で未設定です');
    return;
  }

  const gatewayKey=sessionStorage.getItem(CHAT_KEY_SESSION)||document.getElementById('gateway-key').value.trim();
  if(!gatewayKey){
    toggleSidebar();
    showToast('Gateway Access Keyを設定してください');
    return;
  }

  const history=messages.slice(-20).map(m=>({
    role:m.role==='ai'?'assistant':'user',
    content:m.content
  }));

  messages.push({role:'user',content:text,ai:currentAI});
  saveMessages();
  input.value='';
  autoResize(input);
  renderMessages();
  showTyping();
  setLoading(true);

  try{
    const res=await fetch(GATEWAY_BASE+'/api/chat',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+gatewayKey
      },
      body:JSON.stringify({
        message:text,
        preferred_provider:provider,
        verify:false,
        history
      })
    });
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.detail||('HTTP '+res.status));
    hideTyping();
    const reply=data.integrated_answer || data.answer?.text || '応答を取得できませんでした';
    messages.push({role:'ai',content:String(reply),ai:currentAI});
    saveMessages();
  }catch(e){
    hideTyping();
    messages.push({role:'ai',content:'❌ 接続エラー: '+e.message,ai:currentAI});
    saveMessages();
  }finally{
    setLoading(false);
    renderMessages();
  }
}

function renderMessages(){
  const area=document.getElementById('chat-area');
  const empty=document.getElementById('empty-state');
  if(messages.length===0){
    empty.style.display='flex';
    area.querySelectorAll('.msg').forEach(el=>el.remove());
    return;
  }
  empty.style.display='none';
  area.querySelectorAll('.msg').forEach(el=>el.remove());
  messages.forEach(m=>{
    const div=document.createElement('div');
    div.className='msg '+(m.role==='user'?'user':'ai');
    const aiLabel=m.ai==='gemini'?'Gemini':'ChatGPT';
    const badge=m.ai==='gemini'?'badge-gemini':'badge-chatgpt';

    const bubble=document.createElement('div');
    bubble.className='msg-bubble';
    bubble.textContent=m.content;

    const meta=document.createElement('div');
    meta.className='msg-meta '+(m.role==='ai'?badge:'');
    meta.textContent=m.role==='ai'?aiLabel:'あなた';

    div.appendChild(bubble);
    div.appendChild(meta);
    area.appendChild(div);
  });
  area.scrollTop=area.scrollHeight;
}

let typingEl=null;
function showTyping(){
  const area=document.getElementById('chat-area');
  typingEl=document.createElement('div');
  typingEl.className='msg ai';
  typingEl.id='typing-indicator';
  typingEl.innerHTML='<div class="msg-bubble typing-bubble"><span></span><span></span><span></span></div>';
  area.appendChild(typingEl);
  area.scrollTop=area.scrollHeight;
}
function hideTyping(){if(typingEl){typingEl.remove();typingEl=null}}
function setLoading(v){
  isLoading=v;
  document.getElementById('send-btn').disabled=v;
  document.getElementById('user-input').disabled=v;
}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px'}
function clearChat(){
  messages=[];
  saveMessages();
  renderMessages();
  closeSidebar();
  showToast('チャット履歴を削除しました');
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2600);
}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));
}
</script>
</body>
</html>
